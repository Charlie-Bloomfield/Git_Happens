<style>
  .code-symbol { animation: code-float 1.9s ease-in-out infinite; }
  .branch-symbol { animation: branch-float 2.2s ease-in-out infinite; }
  @keyframes code-float {
    0%, 100% { transform: translateY(16px); }
    50% { transform: translateY(-40px); }
  }
  @keyframes branch-float {
    0%, 100% { transform: translateY(18px); }
    50% { transform: translateY(-38px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .code-symbol, .branch-symbol { animation: none; }
  }
</style>
